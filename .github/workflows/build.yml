name: Test and build Android app

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      olubServer:
        description: 'Olub server address to bake into the app (optional)'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PolubServer="${{ inputs.olubServer }}"
      - uses: actions/upload-artifact@v4
        with:
          name: olub-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
